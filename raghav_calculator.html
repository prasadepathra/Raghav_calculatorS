<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raghav Calculator</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; }
    .calculator { width: min(92vw, 360px); padding: 22px; border-radius: 20px; background: #1f2937; box-shadow: 0 18px 50px #0008; }
    h1 { margin: 0 0 16px; font-size: 1.35rem; text-align: center; color: #93c5fd; }
    #display { width: 100%; box-sizing: border-box; margin-bottom: 14px; padding: 16px; border: 0; border-radius: 12px; background: #0b1220; color: #f9fafb; font-size: 2rem; text-align: right; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { min-height: 58px; border: 0; border-radius: 12px; background: #374151; color: #f9fafb; font-size: 1.2rem; cursor: pointer; }
    button:hover { background: #4b5563; }
    .operator { background: #2563eb; }
    .operator:hover { background: #3b82f6; }
    .clear { background: #b91c1c; }
    .equals { background: #059669; grid-row: span 2; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Raghav Calculator">
    <h1>Raghav Calculator</h1>
    <input id="display" value="0" readonly aria-label="Calculator display">
    <section class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="backspace">âŒ«</button>
      <button class="operator" data-action="percent">%</button>
      <button class="operator" data-value="/">Ã·</button>
      <button class="operator" data-value="*">Ã—</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
      <button class="operator" data-value="-">âˆ’</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>
      <button class="zero" data-value="0">0</button><button data-value=".">.</button>
    </section>
  </main>
  <script>
    const display = document.querySelector('#display');
    let expression = '';
    function render() { display.value = expression || '0'; }
    function calculate() {
      if (!expression) return;
      if (!/^[0-9+*/().\s-]+$/.test(expression)) return;
      try {
        const result = Function(`"use strict"; return (${expression})`)();
        if (!Number.isFinite(result)) throw new Error('Invalid result');
        expression = String(result);
      } catch { expression = 'Error'; }
      render();
    }
    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'clear') expression = '';
      else if (action === 'backspace') expression = expression.slice(0, -1);
      else if (action === 'percent') {
        if (expression) expression = `(${expression})/100`;
      }
      else if (action === 'equals') calculate();
      else {
        if (expression === 'Error') expression = '';
        expression += button.dataset.value;
      }
      render();
    });
    document.addEventListener('keydown', event => {
      if (event.key === '%') {
        if (expression) expression = `(${expression})/100`;
      }
      else if (/^[0-9.+*/()\-]$/.test(event.key)) expression += event.key;
      else if (event.key === 'Enter' || event.key === '=') calculate();
      else if (event.key === 'Backspace') expression = expression.slice(0, -1);
      else if (event.key === 'Escape') expression = '';
      else return;
      render();
    });
  </script>
</body>
</html>
